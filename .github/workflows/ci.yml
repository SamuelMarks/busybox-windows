# =============================================================================
# .github/workflows/ci.yml - CI/CD Pipeline for BusyBox Windows
#
# Runs Python static analysis (ruff, interrogate, mypy --strict, pytest 100%
# branch coverage, pre-commit), compiles BusyBox natively with MSVC (x86_64) on
# windows-latest, executes the CTest functional applet verification suite,
# packages portable ZIP, NSIS (.exe), and WiX (.msi) installers via CPack, and
# publishes release assets to GitHub Releases on v* tags.
# =============================================================================

name: Build and Release BusyBox Windows

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - '1.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'BusyBox tag or branch to build'
        required: false
        default: 'e6302b2711d851bfb17eaf9316514c9d0a806cc7'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout busybox-windows
        uses: actions/checkout@v7

      - name: Checkout auto-win-msvc
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/auto-win-msvc
          ref: 6ff8525b2e0541fab3b792b78ce80cf055322787
          path: auto-win-msvc

      - name: Checkout busybox
        run: |
          ref="${{ github.event.inputs.version || 'e6302b2711d851bfb17eaf9316514c9d0a806cc7' }}"
          git clone --depth 200 https://git.busybox.net/busybox busybox
          git -C busybox checkout -B master "$ref"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python QA & Coverage Tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov mypy ruff interrogate pre-commit

      - name: Run Python Unit Tests (100% Coverage), Typing (mypy --strict), and Pre-Commit
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
          interrogate --fail-under=100 -vv scripts tests
          mypy --strict scripts tests
          pytest --cov=scripts --cov=tests --cov-branch --cov-fail-under=100
          pre-commit run --all-files

  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout busybox-windows
        uses: actions/checkout@v7

      - name: Checkout auto-win-msvc
        uses: actions/checkout@v7
        with:
          repository: SamuelMarks/auto-win-msvc
          ref: 6ff8525b2e0541fab3b792b78ce80cf055322787
          path: auto-win-msvc

      - name: Checkout busybox
        shell: pwsh
        run: |
          $ref = "${{ github.event.inputs.version || 'e6302b2711d851bfb17eaf9316514c9d0a806cc7' }}"
          git clone --depth 200 https://git.busybox.net/busybox busybox
          git -C busybox checkout -B master $ref

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python QA & Coverage Tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov mypy ruff interrogate pre-commit

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_AUTO_WIN_MSVC=auto-win-msvc -DBUSYBOX_SOURCE_DIR=busybox

      - name: Build BusyBox
        shell: cmd
        run: |
          cmake --build build --config Release

      - name: Test BusyBox (CTest)
        shell: cmd
        run: |
          ctest --test-dir build -C Release --output-on-failure
          build\Release\busybox.exe --help

      - name: Run Python Static Analysis and Unit Tests on Windows
        shell: pwsh
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
          interrogate --fail-under=100 -vv scripts tests
          mypy --strict scripts tests
          pytest --no-cov
          $env:SKIP = "pytest-coverage"
          pre-commit run --all-files

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisPath = if (Test-Path "${env:ProgramFiles(x86)}\NSIS") { "${env:ProgramFiles(x86)}\NSIS" } else { "$env:ProgramFiles\NSIS" }
          echo "$nsisPath" >> $env:GITHUB_PATH
          & "$nsisPath\makensis.exe" /VERSION

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          if (-not ($env:WIX -and (Test-Path "$env:WIX\bin\candle.exe")) -and -not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y
          }
          $wixBin = if ($env:WIX -and (Test-Path "$env:WIX\bin\candle.exe")) {
            "$env:WIX\bin"
          } else {
            (Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\bin\candle.exe", "$env:ProgramFiles\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
          }
          if ($wixBin) {
            echo "$wixBin" >> $env:GITHUB_PATH
            & "$wixBin\candle.exe" -? | Select-Object -First 1
          }

      - name: Package with CPack
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/*") {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            "1.39.0"
          }
          $pkgVersion = if ($version -match '^\d+\.\d+\.\d+(\.\d+)?$') { $version } else { "1.39.0" }
          $fileName = "busybox-$version-$($env:RUNNER_ARCH)"
          Push-Location build
          cpack -C Release -G ZIP -D "CPACK_PACKAGE_VERSION=$pkgVersion" -D "CPACK_PACKAGE_FILE_NAME=$fileName"
          cpack -C Release -G NSIS -D "CPACK_PACKAGE_VERSION=$pkgVersion" -D "CPACK_PACKAGE_FILE_NAME=$fileName"
          cpack -C Release -G WIX -D "CPACK_PACKAGE_VERSION=$pkgVersion" -D "CPACK_PACKAGE_FILE_NAME=$fileName"
          Pop-Location

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: busybox-windows-${{ runner.arch }}-packages
          path: |
            build/busybox-*-${{ runner.arch }}.zip
            build/busybox-*-${{ runner.arch }}.exe
            build/busybox-*-${{ runner.arch }}.msi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BusyBox for Windows ${{ github.ref_name }}
          files: |
            build/busybox-*-${{ runner.arch }}.exe
            build/busybox-*-${{ runner.arch }}.msi
            build/busybox-*-${{ runner.arch }}.zip
          generate_release_notes: true
