[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "busybox-windows-tooling"
version = "1.39.0"
description = "Build, patch, header codegen, and test orchestration tooling for busybox-windows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0 OR CC0-1.0" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --cov=scripts --cov=tests --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["scripts", "tests"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_defs = true
disallow_any_unimported = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
preview = true
select = [
    "D",   # pydocstyle (docstring coverage & formatting)
    "DOC", # pydoclint (docstring argument, return, yield, and exception completeness)
    "ANN", # flake8-annotations (strict typing)
    "B",   # flake8-bugbear
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.interrogate]
fail-under = 100
verbose = 2
